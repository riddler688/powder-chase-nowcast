# Powder Chase – Regenradar/Nowcast alle 15 min (Hilfs-Repo, öffentlich wegen freier Workflow-Minuten).
# Der Code liegt im privaten Haupt-Repo und wird nur zur Laufzeit geholt (Secret MAIN_REPO_TOKEN, nur Lesen).
# Anstoß: cron-job.org → workflow_dispatch alle 15 min; der Zeitplan unten ist nur Rückfall (GitHub-Cron ist unzuverlässig).
name: Nowcast

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: nowcast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEOSPHERE_RELAY: ${{ secrets.GEOSPHERE_RELAY }}
      GEOSPHERE_RELAY_KEY: ${{ secrets.GEOSPHERE_RELAY_KEY }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - name: Skripte aus dem Haupt-Repo holen
        uses: actions/checkout@v4
        with:
          repository: riddler688/powder-chase
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          sparse-checkout: scripts
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Radar-Archiv (15-min-Bilder der letzten 2 Tage) wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: |
            data/forecast_archive/radar
            ~/.cache/uv
          key: radar-${{ github.run_id }}
          restore-keys: radar-

      - name: Raster der Prognose vom Server holen
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          mkdir -p data
          lftp -c "set ftp:ssl-allow yes; set net:max-retries 2; set net:timeout 20; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; cd \"${FTP_DIR:-/}\"; get data/forecast.json -o data/forecast.json"

      - name: Nowcast
        timeout-minutes: 5
        run: uv run scripts/fetch_nowcast.py

      - name: Hochladen (Bilder zuerst, Index zuletzt)
        run: |
          lftp -c "set ftp:ssl-allow yes; set net:max-retries 3; set net:timeout 30; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\"; cd \"${FTP_DIR:-/}\"; put -O data data/nowcast.binz; put -O data data/radar.binz; put -O data data/nowt.binz; put -O data data/nowcast.json"

      - name: Radar-Archiv sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/forecast_archive/radar
            ~/.cache/uv
          key: radar-${{ github.run_id }}
